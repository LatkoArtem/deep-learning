[project]
name = "lab4-fp32-int8"
version = "0.1.0"
description = "Лабораторна робота 4: порівняння FP32 та INT8"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "onnx==1.20.1",
    "onnxruntime==1.29.0",
    "pillow==13.0.0",
    "scikit-learn==1.9.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
